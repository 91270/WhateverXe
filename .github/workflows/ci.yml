name: CI

on:
  push:
    branches:
      - main
      - research/tgl-aux-dc6-native-witness-20261123
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          path: MacKernelSDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/Lilu
          ref: 1.7.2
          path: build/dependencies/Lilu
          persist-credentials: false
      - name: Prepare Lilu development files
        shell: bash
        run: |
          mkdir -p Lilu.kext/Contents/Resources
          ln -s "$GITHUB_WORKSPACE/build/dependencies/Lilu/Lilu/Headers" Lilu.kext/Contents/Resources/Headers
          ln -s "$GITHUB_WORKSPACE/build/dependencies/Lilu/Lilu/Library" Lilu.kext/Contents/Resources/Library
      - name: CPU tests
        run: python3 tools/test.py
      - name: Build DEBUG
        run: python3 tools/build.py --output build/DEBUG
      - name: Build RELEASE
        run: python3 tools/build.py --release --output build/RELEASE
      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 tools/package.py --build build/DEBUG --configuration DEBUG --tag "$RELEASE_TAG"
          python3 tools/package.py --build build/RELEASE --configuration RELEASE --tag "$RELEASE_TAG"
          cd build/dist
          shasum -a 256 *.zip > SHA256SUMS
      - name: Upload packages for release consumers
        if: >-
          (github.event_name == 'push' &&
           github.repository == 'b00t0x/WhateverXe' &&
           startsWith(github.ref, 'refs/tags/')) ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
           github.repository == '91270/WhateverXe' &&
           github.ref == 'refs/heads/research/tgl-aux-dc6-native-witness-20261123')
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            build/dist/*.zip
            build/dist/SHA256SUMS
            !build/dist/*.map
            !build/dist/*.log
            !build/dist/**/*.map
            !build/dist/**/*.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results
          path: |
            build/tests/**/test.log
            build/tests/**/results.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'b00t0x/WhateverXe'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: dist
      - name: Attach verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,body \
              --jq 'select(.isDraft == true) | .body' > release-notes.md && test -s release-notes.md; then
            : # Preserve release text explicitly supplied with the draft.
          else
            python3 tools/release_notes.py "$RELEASE_TAG" > release-notes.md
          fi
          cd dist
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            test "$(cat release-state)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file ../release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file ../release-notes.md
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber

  nightly:
    name: Update rolling Nightly pre-release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/research/tgl-aux-dc6-native-witness-20261123' &&
      github.repository == '91270/WhateverXe'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: whateverxe-nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: dist
      - name: Publish rolling Nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "WhateverXe Nightly" \
              --notes "Rolling nightly build from commit $GITHUB_SHA." --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --verify-tag --prerelease \
              --title "WhateverXe Nightly" \
              --notes "Rolling nightly build from commit $GITHUB_SHA." --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          current_assets="$(printf '%s\n' *.zip SHA256SUMS)"
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")"
          while IFS= read -r asset_name; do
            [[ -n "$asset_name" ]] || continue
            if ! grep -Fxq "$asset_name" <<< "$current_assets"; then
              gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes --repo "$GITHUB_REPOSITORY"
              echo "Deleted stale Nightly asset: $asset_name"
            fi
          done <<< "$existing_assets"

  cleanup-artifacts:
    name: Delete temporary build artifact
    needs: [build, release, nightly]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this run's cross-job package artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "Artifacts") | .id')"
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null
            echo "Deleted temporary artifact $artifact_id"
          done <<< "$artifact_ids"
